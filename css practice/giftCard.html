<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .gift-card {
            width: 300px;
            background: white;
            margin: 50px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .gift-card img {
            width: 100%;
            height: 180px;
            object-fit: fill;
        }

        .gift-card h2 {
            margin-top: 15px;
            color: #333;
        }

        .gift-card p {
            margin: 10px 15px;
            color: #666;
        }

        .gift-card button {
            margin: 15px 0 20px;
            padding: 10px 20px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .gift-card button:hover {
            background: blue;
        }
    </style>
</head>

<body>

    <div class="gift-card">
        <img src="download (1).jpg" alt="gift-card">
        <h2>Gift Card</h2>

        <p>Surprise your loved ones with a special gift.</p>

        <button>Buy Now</button>
    </div>
</body>

</html>
