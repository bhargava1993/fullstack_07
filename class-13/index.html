<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: tomato;
            border: 2px solid black;
            height: 500px;
            width: 500px;
            width: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* flex-wrap: wrap; */
            /* align-items: stretch;
            flex-direction: column; */
        }

        .box{
            height: 100px;
            width:100px;
            min-width: 50px;
            /* max-width: 200px; */
            background-color: dodgerblue;
            margin: 10px;
            /* gap:10px; */
            /* text-decoration: underline; */
        }

        .box1{
            order: 4;
        }
        .box2{
            order: 1;
            flex-grow: 2;
        }
        .box3{
            order: 2;
            /* flex-shrink: 4; */
        }
        .box4{
            order: 3;
            flex-grow: 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1" style="font-size: 16px;">
            <span>1</span></div>
        <div class="box box2" style="font-size: 32px;"><span>2</span></div>
        <div class="box box3" style="font-size: 48px;"><span>3</span></div>
        <div class="box box4" style="font-size: 22px;"><span>4</span></div>
    </div>
</body>
</html>
