<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form>
        <label for="fullname">First Name:</label>
        <input type="text" value="bhargava" placeholder="First Name" minlength="3" id="fullname" />
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="email" value="bhargava@gmail.com" readonly disabled placeholder="enter email id" />
        <br>
        <br>
        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
        <br>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="enter password">
        <br>
        <br>
        <label for="number">Number:</label>
        <input id="number" type="number" step="1" min="4" max="10" value="4" />
        <br>
        <br>
        <label for="range">Range:</label>
        <input type="range" id="range" man="1" max="100" step="5" />
        <br>
        <br>

        <!-- multiple select values use checkbox-->
        <label for="skills">Skills:</label>
        <br>
        <input type="checkbox" value="HTML" /> <span>HTML</span>
        <input type="checkbox" /> <span>css</span>
        <input type="checkbox" /> <span>Javascript</span>
        <input type="checkbox" /> <span>React.js</span>
        <input type="checkbox" /> <span>node.js</span>
        <input type="checkbox" /> <span>Mongodb</span>
        <input type="checkbox" /> <span>tailwindCss</span>
        <br>
        <br>

        <!-- To select single value use radio buttons -->
        <label for="gender">Gender:</label>
        <br>
        <input type="radio" name="gender" /> Male
        <input type="radio" name="gender" /> Female
        <input type="radio" name="gender" /> Other
        <br>
        <br>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option name="">select</option>
            <option name="India">India</option>
            <option name="USA">USA</option>
            <option name="China">China</option>
            <option name="Japan">Japan</option>
            <option name="Russia">Russia</option>
        </select>
        <br>
        <br>
        <label for="date">Date:</label>
        <input type="date" min="2027-07-24" max="2027-07-31" />
        <br>
        <br>
        <label for="time">Time:</label>
        <input type="time" />
        <br>
        <br>
        <label for="month">Month:</label>
        <input type="month" />
        <br>
        <br>
        <label for="week">Week:</label>
        <input type="week" />
        <br>
        <br>
        <label for="color">color:</label>
        <input type="color" />
        <br>
        <br>
        <label for="resume">Resume</label>
        <input type="file" accept="image/*" multiple/>
        <br>
        <br>
        <label for="details">Details</label>
        <textarea placeholder="Enter Details" rows="4" cols="30" minlength="10" maxlength="200"></textarea>
        <br>
        <br>
        <input type="submit">
        <input type="reset">
    </form>




    <!-- <button>Login</button> -->

</body>

</html>
